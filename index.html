<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Local de Votação — Eleições 2026</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f4f4; }

  .bloco { padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  .bloco-principal { background: #eaf2fb; border: 1px solid #c5dbf3; }
  .bloco-zona { background: #eef7ee; border: 1px solid #c8e6c9; }
  .bloco-bairro { background: #fdf3e7; border: 1px solid #f5ddb8; }

  .cabecalho { text-align: center; margin-bottom: 20px; }
  .eleicao { display: inline-block; background: #0066cc; color: #fff; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 18px; letter-spacing: 1px; margin-bottom: 15px; }
  h1 { color: #333; font-size: 20px; margin: 10px 0 5px; }
  .municipio { color: #0066cc; font-size: 15px; font-weight: bold; margin: 5px 0; }
  .subtitulo { color: #666; font-size: 14px; margin: 0; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  .dica { font-size: 12px; color: #666; font-weight: normal; }
  .botoes { display: flex; gap: 10px; margin-top: 20px; }
  button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  #btnConsultar { background: #0066cc; color: #fff; }
  #btnConsultar:hover { background: #0055aa; }
  #btnLimpar { background: #e0e0e0; color: #333; }
  #btnLimpar:hover { background: #cccccc; }
  #resultado { margin-top: 20px; }
  .item { padding: 15px; background: #fff; border-radius: 8px; margin-bottom: 10px; }
  .item p { margin: 6px 0; }
  .titulo-item { font-weight: bold; margin-bottom: 8px; }
  .sem-alteracao { background: #e6f4ea; border-left: 4px solid #34a853; }
  .sem-alteracao .titulo-item { color: #1e7e34; }
  .com-alteracao { background: #fff8e1; border-left: 4px solid #f9a825; }
  .com-alteracao .titulo-item { color: #b26a00; }
  .erro { color: #c00; font-weight: bold; padding: 15px; background: #fff; border-radius: 8px; }

  .secao-titulo {
    font-size: 16px;
    color: #0066cc;
    font-weight: bold;
    text-align: center;
    margin: 0;
    padding: 12px;
    background: #dbe9f8;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .secao-titulo:hover { background: #c5dbf3; }
  .secao-titulo .seta { font-size: 12px; transition: transform 0.2s; }
  .secao-titulo.aberto .seta { transform: rotate(180deg); }

  .secao-conteudo { display: none; margin-top: 15px; }
  .secao-conteudo.aberto { display: block; }

  .local-botao { display: block; width: 100%; text-align: left; padding: 12px 15px; margin-bottom: 8px; background: #fff; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; cursor: pointer; color: #333; }
  .local-botao:hover { background: #eef4ff; border-color: #0066cc; }
  .local-titulo { font-weight: bold; color: #0066cc; margin-bottom: 8px; }
  .local-endereco { color: #555; font-size: 14px; margin-bottom: 10px; }
  .secoes-lista { display: flex; flex-wrap: wrap; gap: 6px; }
  .secao-tag { background: #eef4ff; color: #0066cc; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
  .bairro-botao { display: block; width: 100%; text-align: left; padding: 14px 15px; margin-bottom: 8px; background: #dde7f7; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #333; }
  .bairro-botao:hover { background: #ccd9f0; }
  .bairro-titulo { font-weight: bold; color: #333; font-size: 15px; padding: 8px 12px; background: #dde7f7; border-radius: 6px; margin-bottom: 10px; }

  .chips-container { margin-top: 10px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; max-height: 200px; overflow-y: auto; }
  .chips-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-zona { padding: 8px 14px; background: #eef4ff; color: #0066cc; border: 2px solid transparent; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .chip-zona:hover { background: #d9e7ff; border-color: #0066cc; }
  .chip-zona.selecionado { background: #0066cc; color: #fff; }
  .chip-vazio { padding: 15px; text-align: center; color: #999; font-style: italic; }
  .chip-bairro { padding: 8px 14px; background: #f0e8dd; color: #7a5c2e; border: 2px solid transparent; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .chip-bairro:hover { background: #e5d8c5; border-color: #a07840; }
  .chip-bairro.selecionado { background: #a07840; color: #fff; }
</style>
</head>
<body>

<div class="cabecalho">
  <span class="eleicao">ELEIÇÕES 2026</span>
  <h1>Consulta de Local de Votação</h1>
  <p class="municipio">Município do Rio de Janeiro</p>
  <p class="subtitulo">Correspondência de zona e seção eleitoral</p>
</div>

<div class="bloco bloco-principal">
  <label>Zona:</label>
  <input type="text" inputmode="numeric" id="zonaAntiga" placeholder="Ex: 100">

  <label>Seção: <span class="dica">(opcional)</span></label>
  <input type="text" inputmode="numeric" id="secaoAntiga" placeholder="Ex: 45">

  <div class="botoes">
    <button id="btnConsultar" onclick="consultar()">Consultar</button>
    <button id="btnLimpar" onclick="limpar()">Limpar</button>
  </div>

  <div id="resultado"></div>
</div>

<div class="bloco bloco-zona">
  <div class="secao-titulo" id="tituloZona" onclick="toggleSecao('zona')">
    <span>🔎 Consulta por Zona</span>
    <span class="seta">▼</span>
  </div>
  <div class="secao-conteudo" id="conteudoZona">
    <div class="chips-container" id="chipsContainer">
      <div class="chip-vazio">Carregando zonas...</div>
    </div>
    <div id="resultadoLocal" style="margin-top: 20px;"></div>
  </div>
</div>

<div class="bloco bloco-bairro">
  <div class="secao-titulo" id="tituloBairro" onclick="toggleSecao('bairro')" style="background: #f5ddb8; color: #7a5c2e;">
    <span>🔎 Consulta por Bairro</span>
    <span class="seta">▼</span>
  </div>
  <div class="secao-conteudo" id="conteudoBairro">
    <div class="chips-container" id="chipsBairrosContainer">
      <div class="chip-vazio">Carregando bairros...</div>
    </div>
    <div id="resultadoBairro" style="margin-top: 20px;"></div>
  </div>
</div>

<script>
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTiHhCJ23TNCn4WU5_jxUdTYmCSGzWSfGGO8aXGKpGit7aXYC-OJw2C8-YIgPqs5wFvGh0l3qethGrQ/pub?gid=0&single=true&output=csv";

const BAIRROS = [
  "Caju", "Catumbi", "Centro", "Cidade Nova", "Estácio", "Gamboa", "Glória",
  "Ilha de Paquetá", "Lapa", "Rio Comprido", "Santa Teresa", "Santo Cristo", "Saúde",
  "Botafogo", "Catete", "Copacabana", "Cosme Velho", "Flamengo", "Gávea",
  "Humaitá", "Ipanema", "Jardim Botânico", "Lagoa", "Laranjeiras", "Leblon",
  "Leme", "Rocinha", "São Conrado", "Urca", "Vidigal",
  "Abolição", "Acari", "Água Santa", "Alto da Boa Vista", "Anchieta", "Andaraí",
  "Bancários", "Barros Filho", "Benfica", "Bento Ribeiro", "Bonsucesso",
  "Brás de Pina", "Cachambi", "Cacuia", "Campinho", "Cascadura", "Cavalcanti",
  "Cidade Universitária", "Cocotá", "Coelho Neto", "Colégio", "Complexo do Alemão",
  "Cordovil", "Costa Barros", "Del Castilho", "Encantado", "Engenheiro Leal",
  "Engenho da Rainha", "Engenho de Dentro", "Engenho Novo", "Freguesia",
  "Galeão", "Grajaú", "Guadalupe", "Higienópolis", "Honório Gurgel", "Inhaúma",
  "Irajá", "Jacaré", "Jacarezinho", "Jardim América", "Jardim Carioca",
  "Jardim Guanabara", "Lins de Vasconcelos", "Madureira", "Mangueira",
  "Manguinhos", "Maracanã", "Maré", "Marechal Hermes", "Maria da Graça",
  "Méier", "Moneró", "Olaria", "Oswaldo Cruz", "Parada de Lucas",
  "Parque Anchieta", "Parque Colúmbia", "Pavuna", "Penha", "Penha Circular",
  "Piedade", "Pilares", "Pitangueiras", "Portuguesa", "Praça da Bandeira",
  "Praia da Bandeira", "Quintino Bocaiúva", "Ramos", "Riachuelo", "Ribeira",
  "Ricardo de Albuquerque", "Rocha", "Rocha Miranda", "Sampaio", "São Cristóvão",
  "São Francisco Xavier", "Tauá", "Tijuca", "Todos os Santos", "Tomás Coelho",
  "Turiaçu", "Vasco da Gama", "Vaz Lobo", "Vicente de Carvalho", "Vigário Geral",
  "Vila da Penha", "Vila Isabel", "Vila Kosmos", "Vista Alegre", "Zumbi",
  "Bangu", "Barra de Guaratiba", "Campo dos Afonsos", "Campo Grande", "Cosmos",
  "Deodoro", "Gericinó", "Guaratiba", "Ilha de Guaratiba", "Inhoaíba", "Jabour",
  "Jardim Sulacap", "Magalhães Bastos", "Paciência", "Padre Miguel",
  "Pedra de Guaratiba", "Realengo", "Santa Cruz", "Santíssimo", "Senador Camará",
  "Senador Vasconcelos", "Sepetiba", "Triagem", "Vila Kennedy", "Vila Militar",
  "Anil", "Barra da Tijuca", "Barra Olímpica", "Camorim", "Cidade de Deus",
  "Curicica", "Freguesia de Jacarepaguá", "Freguesia JPA", "Gardênia Azul", "Jacarepaguá",
  "Grumari", "Itanhangá", "Joá", "Pechincha", "Praça Seca",
  "Recreio", "Recreio dos Bandeirantes", "Bairro de Fátima", "Fátima",
  "Tanque", "Taquara", "Vargem Grande", "Vargem Pequena", "Vila Valqueire"
];

const BAIRROS_ORDENADOS = [...BAIRROS].sort((a, b) => b.length - a.length);

let dados = [];
let zonasDisponiveis = [];
let zonaSelecionada = "";
let bairrosDisponiveis = [];
let bairroSelecionado = "";

function normalizar(valor) {
  const s = String(valor).trim();
  if (s === "") return "";
  const num = parseInt(s, 10);
  if (isNaN(num)) return s;
  return String(num);
}

function simplificar(texto) {
  return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
}

function extrairBairro(endereco) {
  const enderecoSimp = simplificar(endereco);
  for (const bairro of BAIRROS_ORDENADOS) {
    if (enderecoSimp.endsWith(simplificar(bairro))) {
      if (bairro === "Recreio") return "Recreio dos Bandeirantes";
      if (bairro === "Fátima") return "Bairro de Fátima";
      if (bairro === "Freguesia JPA") return "Freguesia de Jacarepaguá";
      return bairro;
    }
  }
  return "Outros";
}

function toggleSecao(qual) {
  const conteudo = document.getElementById(qual === "zona" ? "conteudoZona" : "conteudoBairro");
  const titulo = document.getElementById(qual === "zona" ? "tituloZona" : "tituloBairro");
  conteudo.classList.toggle("aberto");
  titulo.classList.toggle("aberto");
}

fetch(URL_CSV)
  .then(r => r.text())
  .then(texto => {
    const linhas = texto.split("\n");
    for (let i = 1; i < linhas.length; i++) {
      const colunas = linhas[i].split(",");
      if (colunas.length < 6) continue;
      const endereco = colunas[5].trim();
      dados.push({
        zonaAntiga: normalizar(colunas[0]),
        secaoAntiga: normalizar(colunas[1]),
        zonaNova: normalizar(colunas[2]),
        secaoNova: normalizar(colunas[3]),
        local: colunas[4].trim(),
        endereco: endereco,
        bairro: extrairBairro(endereco)
      });
    }
    zonasDisponiveis = [...new Set(dados.map(d => d.zonaNova))]
      .sort((a, b) => Number(a) - Number(b));

    bairrosDisponiveis = [...new Set(dados.map(d => d.bairro))]
      .sort((a, b) => a.localeCompare(b, "pt-BR"));

    renderizarChips();
    renderizarChipsBairros();
  })
  .catch(() => alert("Erro ao carregar dados. Verifique a conexão."));

function consultar() {
  const z = normalizar(document.getElementById("zonaAntiga").value);
  const s = normalizar(document.getElementById("secaoAntiga").value);
  const div = document.getElementById("resultado");

  if (!z) {
    div.innerHTML = '<p class="erro">Preencha pelo menos a Zona.</p>';
    return;
  }

  let achados;
  if (s) {
    achados = dados.filter(d => d.zonaAntiga === z && d.secaoAntiga === s);
  } else {
    achados = dados.filter(d => d.zonaAntiga === z);
  }

  if (achados.length === 0) {
    div.innerHTML = '<p class="erro">Nenhuma correspondência encontrada. Confira os números digitados.</p>';
    return;
  }

  if (s) {
    const a = achados[0];
    const semAlteracao = (a.zonaAntiga === a.zonaNova && a.secaoAntiga === a.secaoNova);
    if (semAlteracao) {
      div.innerHTML = `
        <div class="item sem-alteracao">
          <p class="titulo-item">✅ A numeração de sua zona e seção não sofreu alteração.</p>
          <p><strong>Zona:</strong> ${a.zonaAntiga}</p>
          <p><strong>Seção:</strong> ${a.secaoAntiga}</p>
          <p><strong>Local:</strong> ${a.local}</p>
          <p><strong>Endereço:</strong> ${a.endereco}</p>
        </div>
      `;
    } else {
      div.innerHTML = `
        <div class="item com-alteracao">
          <p class="titulo-item">⚠️ Atenção! A numeração de sua zona e seção sofreu alteração.</p>
          <p><strong>Zona Nova:</strong> ${a.zonaNova}</p>
          <p><strong>Seção Nova:</strong> ${a.secaoNova}</p>
          <p><strong>Local:</strong> ${a.local}</p>
          <p><strong>Endereço:</strong> ${a.endereco}</p>
        </div>
      `;
    }
  } else {
    let html = `<p style="font-weight:bold;">Encontradas ${achados.length} seções na zona ${z}:</p>`;
    achados.forEach(a => {
      const semAlteracao = (a.zonaAntiga === a.zonaNova && a.secaoAntiga === a.secaoNova);
      if (semAlteracao) {
        html += `
          <div class="item sem-alteracao">
            <p class="titulo-item">✅ Seção ${a.secaoAntiga} — não sofreu alteração</p>
            <p><strong>Local:</strong> ${a.local}</p>
            <p><strong>Endereço:</strong> ${a.endereco}</p>
          </div>
        `;
      } else {
        html += `
          <div class="item com-alteracao">
            <p class="titulo-item">⚠️ Seção Antiga ${a.secaoAntiga} → Seção Nova ${a.secaoNova} (Zona ${a.zonaNova})</p>
            <p><strong>Local:</strong> ${a.local}</p>
            <p><strong>Endereço:</strong> ${a.endereco}</p>
          </div>
        `;
      }
    });
    div.innerHTML = html;
  }
}

function limpar() {
  document.getElementById("zonaAntiga").value = "";
  document.getElementById("secaoAntiga").value = "";
  document.getElementById("resultado").innerHTML = "";

  zonaSelecionada = "";
  renderizarChips();
  document.getElementById("resultadoLocal").innerHTML = "";

  bairroSelecionado = "";
  renderizarChipsBairros();
  document.getElementById("resultadoBairro").innerHTML = "";

  document.getElementById("zonaAntiga").focus();
}

function renderizarChips() {
  const container = document.getElementById("chipsContainer");
  if (zonasDisponiveis.length === 0) {
    container.innerHTML = '<div class="chip-vazio">Carregando zonas...</div>';
    return;
  }

  let html = '<div class="chips-grid">';
  zonasDisponiveis.forEach(z => {
    const classe = (z === zonaSelecionada) ? "chip-zona selecionado" : "chip-zona";
    html += `<button class="${classe}" onclick="selecionarZona('${z}')">${z}</button>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

function selecionarZona(z) {
  zonaSelecionada = z;
  renderizarChips();
  mostrarBairros();
  document.getElementById("resultadoLocal").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function mostrarBairros() {
  const div = document.getElementById("resultadoLocal");
  if (!zonaSelecionada) { div.innerHTML = ""; return; }

  const registrosZona = dados.filter(d => d.zonaNova === zonaSelecionada);
  if (registrosZona.length === 0) {
    div.innerHTML = '<p class="erro">Nenhum local encontrado para essa zona.</p>';
    return;
  }

  const porBairro = {};
  registrosZona.forEach(d => {
    const b = d.bairro;
    if (!porBairro[b]) porBairro[b] = {};
    if (!porBairro[b][d.local]) {
      porBairro[b][d.local] = { endereco: d.endereco, secoes: [] };
    }
    porBairro[b][d.local].secoes.push(d.secaoNova);
  });

  const bairrosOrdenados = Object.keys(porBairro).sort();
  let totalLocais = 0;
  bairrosOrdenados.forEach(b => totalLocais += Object.keys(porBairro[b]).length);

  let html = `<p style="font-weight:bold;">Zona ${zonaSelecionada} — ${totalLocais} locais em ${bairrosOrdenados.length} bairros. Escolha um bairro:</p>`;

  bairrosOrdenados.forEach(bairro => {
    const qtd = Object.keys(porBairro[bairro]).length;
    html += `<button class="bairro-botao" onclick="mostrarLocaisDoBairro('${bairro.replace(/'/g, "\\'")}')">📍 ${bairro} (${qtd} ${qtd === 1 ? 'local' : 'locais'})</button>`;
  });

  div.innerHTML = html;
}

function mostrarLocaisDoBairro(bairro) {
  const div = document.getElementById("resultadoLocal");
  const registros = dados.filter(d => d.zonaNova === zonaSelecionada && d.bairro === bairro);

  const locais = {};
  registros.forEach(d => {
    if (!locais[d.local]) {
      locais[d.local] = { endereco: d.endereco, secoes: [] };
    }
    locais[d.local].secoes.push(d.secaoNova);
  });

  const nomesLocais = Object.keys(locais).sort();

  let html = `
    <button class="local-botao" onclick="mostrarBairros()" style="background:#f0f0f0;">← Voltar aos bairros</button>
    <p style="font-weight:bold;">Bairro: ${bairro} — ${nomesLocais.length} ${nomesLocais.length === 1 ? 'local' : 'locais'}:</p>
  `;

  nomesLocais.forEach(nome => {
    html += `<button class="local-botao" onclick="mostrarSecoes('${nome.replace(/'/g, "\\'")}')">🏫 ${nome}</button>`;
  });

  div.innerHTML = html;
}

function mostrarSecoes(nomeLocal) {
  const div = document.getElementById("resultadoLocal");
  const registros = dados.filter(d => d.zonaNova === zonaSelecionada && d.local === nomeLocal);

  if (registros.length === 0) {
    div.innerHTML = '<p class="erro">Nenhuma seção encontrada.</p>';
    return;
  }

  const endereco = registros[0].endereco;
  const bairro = registros[0].bairro;

  const secoesUnicas = [...new Set(registros.map(r => r.secaoNova))]
    .sort((a, b) => Number(a) - Number(b));

  let html = `
    <button class="local-botao" onclick="mostrarLocaisDoBairro('${bairro.replace(/'/g, "\\'")}')" style="background:#f0f0f0;">← Voltar aos locais</button>
    <div class="item">
      <p class="local-titulo">📍 ${nomeLocal}</p>
      <p class="local-endereco"><strong>Endereço:</strong> ${endereco}</p>
      <p><strong>Zona:</strong> ${zonaSelecionada} &nbsp;|&nbsp; <strong>Bairro:</strong> ${bairro}</p>
      <p><strong>Seções (${secoesUnicas.length}):</strong></p>
      <div class="secoes-lista">
        ${secoesUnicas.map(s => `<span class="secao-tag">${s}</span>`).join("")}
      </div>
    </div>
  `;
  div.innerHTML = html;
}

function renderizarChipsBairros() {
  const container = document.getElementById("chipsBairrosContainer");
  if (bairrosDisponiveis.length === 0) {
    container.innerHTML = '<div class="chip-vazio">Carregando bairros...</div>';
    return;
  }

  let html = '<div class="chips-grid">';
  bairrosDisponiveis.forEach(b => {
    const classe = (b === bairroSelecionado) ? "chip-bairro selecionado" : "chip-bairro";
    html += `<button class="${classe}" onclick="selecionarBairro('${b.replace(/'/g, "\\'")}')">${b}</button>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

function selecionarBairro(b) {
  bairroSelecionado = b;
  renderizarChipsBairros();
  mostrarLocaisDoBairroConsulta(b);
  document.getElementById("resultadoBairro").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function mostrarLocaisDoBairroConsulta(bairro) {
  const div = document.getElementById("resultadoBairro");
  const registros = dados.filter(d => d.bairro === bairro);

  if (registros.length === 0) {
    div.innerHTML = '<p class="erro">Nenhum local encontrado nesse bairro.</p>';
    return;
  }

  const porZona = {};
  registros.forEach(d => {
    if (!porZona[d.zonaNova]) porZona[d.zonaNova] = {};
    const chave = d.zonaNova + "|" + d.local;
    if (!porZona[d.zonaNova][chave]) {
      porZona[d.zonaNova][chave] = { nome: d.local, endereco: d.endereco, secoes: [] };
    }
    porZona[d.zonaNova][chave].secoes.push(d.secaoNova);
  });

  const zonasOrd = Object.keys(porZona).sort((a, b) => Number(a) - Number(b));
  let totalLocais = 0;
  zonasOrd.forEach(z => totalLocais += Object.keys(porZona[z]).length);

  let html = `<p style="font-weight:bold;">Bairro ${bairro} — ${totalLocais} locais em ${zonasOrd.length} ${zonasOrd.length === 1 ? 'zona' : 'zonas'}:</p>`;

  zonasOrd.forEach(z => {
    html += `<div class="bairro-titulo" style="margin-top:14px;">Zona ${z}</div>`;
    const chaves = Object.keys(porZona[z]).sort((a, b) =>
      porZona[z][a].nome.localeCompare(porZona[z][b].nome, "pt-BR")
    );
    chaves.forEach(chave => {
      const item = porZona[z][chave];
      html += `<button class="local-botao" onclick="mostrarSecoesBairro('${z}', '${item.nome.replace(/'/g, "\\'")}', '${bairro.replace(/'/g, "\\'")}')">🏫 ${item.nome}</button>`;
    });
  });

  div.innerHTML = html;
}

function mostrarSecoesBairro(zona, nomeLocal, bairro) {
  const div = document.getElementById("resultadoBairro");
  const registros = dados.filter(d => d.zonaNova === zona && d.local === nomeLocal);

  if (registros.length === 0) {
    div.innerHTML = '<p class="erro">Nenhuma seção encontrada.</p>';
    return;
  }

  const endereco = registros[0].endereco;

  const secoesUnicas = [...new Set(registros.map(r => r.secaoNova))]
    .sort((a, b) => Number(a) - Number(b));

  let html = `
    <button class="local-botao" onclick="mostrarLocaisDoBairroConsulta('${bairro.replace(/'/g, "\\'")}')" style="background:#f0f0f0;">← Voltar aos locais do bairro</button>
    <div class="item">
      <p class="local-titulo">📍 ${nomeLocal}</p>
      <p class="local-endereco"><strong>Endereço:</strong> ${endereco}</p>
      <p><strong>Zona:</strong> ${zona} &nbsp;|&nbsp; <strong>Bairro:</strong> ${bairro}</p>
      <p><strong>Seções (${secoesUnicas.length}):</strong></p>
      <div class="secoes-lista">
        ${secoesUnicas.map(s => `<span class="secao-tag">${s}</span>`).join("")}
      </div>
    </div>
  `;
  div.innerHTML = html;
}
</script>
